name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Use the reviewed npm toolchain
        run: npm install --global npm@11.19.0

      - run: npm ci
      - name: Test audit policy
        run: node --test scripts/check-audit.node-test.mjs
      - name: Audit dependencies
        run: |
          # Keep the full report visible, including the temporary dev-only
          # deepmerge exception. Network/registry errors must still fail.
          audit_status=0
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || audit_status=$?
          cat "$RUNNER_TEMP/npm-audit.json"
          if [ "$audit_status" -gt 1 ]; then
            exit "$audit_status"
          fi
          node scripts/check-audit.mjs "$RUNNER_TEMP/npm-audit.json"
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
        # Jarvis Assistant: no external leaderboard credential in CI.
        env:
          VITE_SUPABASE_ANON_KEY: ''
